name: Build and Deploy

on:
  push:
    branches:
      - my_phone
  pull_request:
    branches:
      - my_phone
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_VERSION: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install

      - name: Generate TypeScript types
        run: pnpm run generate-types

      - name: Create .env file for build
        run: |
          cat > .env << EOF
          # Build-time configuration from GitHub Secrets
          CASDOOR_URL=${{ secrets.BUILD_CASDOOR_URL }}
          CASDOOR_CLIENT_ID=${{ secrets.BUILD_CASDOOR_CLIENT_ID }}
          CASDOOR_CLIENT_SECRET=${{ secrets.BUILD_CASDOOR_CLIENT_SECRET }}
          GOST_SERVER_ADDR=${{ secrets.BUILD_GOST_SERVER_ADDR }}
          JWKS_ENDPOINT=${{ secrets.BUILD_JWKS_ENDPOINT }}
          FRONTEND_PORT=${{ secrets.BUILD_DEFAULT_SERVICE_PORT }}
          BACKEND_PORT=${{ secrets.BUILD_DEFAULT_SERVICE_PORT }}
          HOST=0.0.0.0
          EOF

      - name: Build frontend
        env:
          VITE_CASDOOR_URL: ${{ secrets.BUILD_CASDOOR_URL }}
          VITE_CASDOOR_CLIENT_ID: ${{ secrets.BUILD_CASDOOR_CLIENT_ID }}
          VITE_JWKS_ENDPOINT: ${{ secrets.BUILD_JWKS_ENDPOINT }}
        run: |
          cd frontend
          pnpm run build

      - name: Build backend
        env:
          CASDOOR_URL: ${{ secrets.BUILD_CASDOOR_URL }}
          CASDOOR_CLIENT_ID: ${{ secrets.BUILD_CASDOOR_CLIENT_ID }}
          CASDOOR_CLIENT_SECRET: ${{ secrets.BUILD_CASDOOR_CLIENT_SECRET }}
          GOST_SERVER_ADDR: ${{ secrets.BUILD_GOST_SERVER_ADDR }}
          JWKS_ENDPOINT: ${{ secrets.BUILD_JWKS_ENDPOINT }}
        run: cargo build --release --bin server

      - name: Run tests
        run: |
          cargo test --workspace
          cd frontend && pnpm run check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/server
            frontend/dist/
          retention-days: 7
